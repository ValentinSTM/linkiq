<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <!-- LinkIQ start picture: a district heating plant at dusk. Two omni antennas sit at the top of the
       chimney (never above it) and cover 360°; the heat meters in the houses reach them with an
       external triangular antenna or the meter's internal one. Replace this file, or choose another
       picture under Mere › Startbillede. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06202f"/>
      <stop offset="0.5" stop-color="#0b3a55"/>
      <stop offset="0.74" stop-color="#2f6f8c"/>
      <stop offset="0.86" stop-color="#e9a15a"/>
      <stop offset="1" stop-color="#e9a15a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a22"/>
      <stop offset="1" stop-color="#1c1410"/>
    </linearGradient>
    <linearGradient id="chim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d1d6"/>
      <stop offset="0.45" stop-color="#f1f4f6"/>
      <stop offset="1" stop-color="#9fabb3"/>
    </linearGradient>
    <linearGradient id="chimR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3262a"/>
      <stop offset="0.45" stop-color="#d8393a"/>
      <stop offset="1" stop-color="#8f1d20"/>
    </linearGradient>
    <linearGradient id="hall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b4258"/>
      <stop offset="1" stop-color="#123247"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="brick" width="36" height="18" patternUnits="userSpaceOnUse">
      <rect width="36" height="18" fill="#a5452b"/>
      <path d="M0 9h36M18 0v9M0 9v9M36 9v9" stroke="#8a3621" stroke-width="2"/>
    </pattern>
    <pattern id="brickY" width="36" height="18" patternUnits="userSpaceOnUse">
      <rect width="36" height="18" fill="#d9b26a"/>
      <path d="M0 9h36M18 0v9M0 9v9M36 9v9" stroke="#bf9851" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.7">
    <circle cx="150" cy="170" r="2.5"/><circle cx="320" cy="95" r="2"/><circle cx="560" cy="230" r="2.5"/>
    <circle cx="780" cy="130" r="2"/><circle cx="930" cy="260" r="3"/><circle cx="700" cy="380" r="2"/>
    <circle cx="220" cy="430" r="2"/><circle cx="990" cy="470" r="2"/><circle cx="380" cy="560" r="1.8"/>
  </g>

  <!-- steam from the chimney, drifting -->
  <path d="M540 640 C510 590 580 570 545 520 C520 485 585 470 560 430" stroke="#dfe7ec" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.22"/>

  <!-- 360° coverage from the antennas at the top of the chimney, seen in perspective -->
  <ellipse cx="540" cy="700" rx="230" ry="200" fill="url(#glow)"/>
  <g fill="none" stroke="#ffd23f" stroke-width="5">
    <path d="M350 705 A190 46 0 0 1 730 705" opacity="0.85"/>
    <path d="M220 712 A320 78 0 0 1 860 712" opacity="0.5" stroke-dasharray="18 14"/>
    <path d="M90 720 A450 110 0 0 1 990 720" opacity="0.28" stroke-dasharray="18 14"/>
  </g>

  <!-- the plant: hall and chimney in the middle -->
  <path d="M250 1230 L250 1050 L540 960 L830 1050 L830 1230 Z" fill="url(#hall)"/>
  <path d="M250 1050 L540 960 L830 1050" stroke="#2c5a73" stroke-width="8" fill="none"/>
  <g fill="#ffd23f">
    <rect x="300" y="1090" width="44" height="34" opacity="0.75"/><rect x="370" y="1090" width="44" height="34" opacity="0.55"/>
    <rect x="666" y="1090" width="44" height="34" opacity="0.75"/><rect x="736" y="1090" width="44" height="34" opacity="0.55"/>
  </g>
  <!-- chimney: wider at the foot, red and white bands near the top -->
  <path d="M492 1240 L506 650 L574 650 L588 1240 Z" fill="url(#chim)"/>
  <path d="M502.6 790 L577.4 790 L578.4 830 L501.6 830 Z" fill="url(#chimR)"/>
  <path d="M505 690 L575 690 L576 730 L504 730 Z" fill="url(#chimR)"/>
  <rect x="500" y="640" width="80" height="14" rx="3" fill="#7d8a92"/>
  <!-- antenna brackets and two omni antennas, one on each side, tops below the chimney top -->
  <g stroke="#cfd8dd" stroke-width="6" fill="none">
    <path d="M505 700 H468 M505 760 H468"/>
    <path d="M575 700 H612 M575 760 H612"/>
  </g>
  <g>
    <rect x="460" y="664" width="12" height="118" rx="6" fill="#f4f6f7"/>
    <rect x="608" y="664" width="12" height="118" rx="6" fill="#f4f6f7"/>
    <rect x="457" y="778" width="18" height="10" rx="2" fill="#7d8a92"/>
    <rect x="605" y="778" width="18" height="10" rx="2" fill="#7d8a92"/>
  </g>

  <!-- front half of the coverage rings, in front of the chimney -->
  <g fill="none" stroke="#ffd23f" stroke-width="5">
    <path d="M350 705 A190 46 0 0 0 730 705" opacity="0.85"/>
    <path d="M220 712 A320 78 0 0 0 860 712" opacity="0.5" stroke-dasharray="18 14"/>
    <path d="M90 720 A450 110 0 0 0 990 720" opacity="0.28" stroke-dasharray="18 14"/>
  </g>
  <!-- Danish row houses in front -->
  <g>
    <rect x="30" y="1330" width="320" height="270" fill="url(#brick)"/>
    <path d="M10 1340 L190 1210 L370 1340 Z" fill="#3b3f44"/>
    <rect x="70" y="1380" width="74" height="80" fill="#ffe08a"/><rect x="236" y="1380" width="74" height="80" fill="#ffe08a"/>
    <path d="M70 1420h74M107 1380v80M236 1420h74M273 1380v80" stroke="#fff" stroke-width="5"/>
    <rect x="160" y="1480" width="64" height="120" fill="#2a3d4a"/>

    <rect x="380" y="1310" width="320" height="290" fill="url(#brickY)"/>
    <path d="M360 1320 L540 1185 L720 1320 Z" fill="#7a2f22"/>
    <rect x="420" y="1360" width="74" height="80" fill="#ffe08a"/><rect x="586" y="1360" width="74" height="80" fill="#2b4556"/>
    <path d="M420 1400h74M457 1360v80M586 1400h74M623 1360v80" stroke="#fff" stroke-width="5"/>
    <rect x="508" y="1480" width="64" height="120" fill="#123247"/>

    <rect x="730" y="1330" width="320" height="270" fill="url(#brick)"/>
    <path d="M710 1340 L890 1210 L1070 1340 Z" fill="#3b3f44"/>
    <rect x="770" y="1380" width="74" height="80" fill="#2b4556"/><rect x="936" y="1380" width="74" height="80" fill="#ffe08a"/>
    <path d="M770 1420h74M807 1380v80M936 1420h74M973 1380v80" stroke="#fff" stroke-width="5"/>
    <rect x="860" y="1480" width="64" height="120" fill="#2a3d4a"/>
  </g>

  <!-- heat meters on the walls: left and right with an external triangular antenna, middle with the internal one -->
  <g>
    <rect x="240" y="1500" width="78" height="62" rx="10" fill="#e8ecef"/>
    <rect x="252" y="1512" width="54" height="20" rx="3" fill="#1f3a2e"/><rect x="257" y="1517" width="44" height="10" fill="#7fe0a0"/>
    <path d="M262 1466 L300 1466 L281 1434 Z" fill="#f4f6f7" stroke="#9aa5ad" stroke-width="3" stroke-linejoin="round"/>
    <path d="M300 1466 L312 1458 L293 1428 L281 1434" fill="#cfd8dd" stroke="#9aa5ad" stroke-width="3" stroke-linejoin="round"/>
    <path d="M281 1466 V1500" stroke="#55626b" stroke-width="4"/>

    <rect x="596" y="1500" width="78" height="62" rx="10" fill="#e8ecef"/>
    <rect x="608" y="1512" width="54" height="20" rx="3" fill="#1f3a2e"/><rect x="613" y="1517" width="44" height="10" fill="#7fe0a0"/>

    <rect x="760" y="1500" width="78" height="62" rx="10" fill="#e8ecef"/>
    <rect x="772" y="1512" width="54" height="20" rx="3" fill="#1f3a2e"/><rect x="777" y="1517" width="44" height="10" fill="#7fe0a0"/>
    <path d="M780 1466 L818 1466 L799 1434 Z" fill="#f4f6f7" stroke="#9aa5ad" stroke-width="3" stroke-linejoin="round"/>
    <path d="M818 1466 L830 1458 L811 1428 L799 1434" fill="#cfd8dd" stroke="#9aa5ad" stroke-width="3" stroke-linejoin="round"/>
    <path d="M799 1466 V1500" stroke="#55626b" stroke-width="4"/>
  </g>
  <!-- small waves from the meters towards the chimney -->
  <g stroke="#ffd23f" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M300 1418 A26 26 0 0 1 326 1440"/><path d="M308 1400 A44 44 0 0 1 344 1438"/>
    <path d="M656 1486 A26 26 0 0 1 682 1508"/><path d="M664 1468 A44 44 0 0 1 700 1506"/>
    <path d="M780 1420 A26 26 0 0 0 756 1442"/><path d="M772 1402 A44 44 0 0 0 736 1440"/>
  </g>

  <!-- ground with district heating pipes: supply (red) and return (blue) -->
  <rect y="1600" width="1080" height="320" fill="url(#ground)"/>
  <rect y="1600" width="1080" height="16" fill="#55626b"/>
  <g stroke-linecap="round">
    <path d="M0 1710 H1080" stroke="#c62828" stroke-width="34"/>
    <path d="M0 1710 H1080" stroke="#e35a4a" stroke-width="10" stroke-dasharray="60 40" opacity="0.6"/>
    <path d="M0 1795 H1080" stroke="#1565c0" stroke-width="34"/>
    <path d="M0 1795 H1080" stroke="#4f8fdc" stroke-width="10" stroke-dasharray="60 40" opacity="0.6"/>
  </g>
  <g stroke-width="12">
    <path d="M190 1710 V1616 M530 1710 V1616 M880 1710 V1616" stroke="#c62828"/>
    <path d="M220 1795 V1616 M560 1795 V1616 M910 1795 V1616" stroke="#1565c0"/>
  </g>
</svg>
