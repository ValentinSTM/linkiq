# docker compose up --build   ->  http://localhost:8000
services:
  linkiq:
    build: .
    ports: ["8000:8000"]
    volumes: ["linkiq-data:/data"]
    environment:
      KAMSTRUP_MODE: sim          # "live" = the real Kamstrup endpoint
      SIM_SPEED: "4"
      # With KAMSTRUP_MODE=live, phone pairing becomes mandatory (scripts/pairing.py)
    restart: unless-stopped

  # HTTPS (required on phones for GPS and installing the PWA). Caddy = Apache-2.0,
  # automatic Let's Encrypt certificate. Uncomment and set the real domain.
  # caddy:
  #   image: caddy:2
  #   ports: ["80:80", "443:443"]
  #   command: caddy reverse-proxy --from linkiq.exemplu.dk --to linkiq:8000
  #   volumes: ["caddy-data:/data"]

volumes:
  linkiq-data:
  # caddy-data:
